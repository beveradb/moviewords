<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Explore the words spoken in movies - per-film word frequencies, trends across decades, leaderboards and comparisons." />
    <title>Movie Words - what films actually say</title>
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Movie Words" />
    <meta property="og:title" content="Movie Words - what films actually say" />
    <meta property="og:description" content="Every word of dialogue in 51,624 films, counted. See what any movie actually says, watch words rise and fall across decades, and compare films head to head." />
    <meta property="og:url" content="https://moviewords.org/" />
    <meta property="og:image" content="https://moviewords.org/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Movie Words - what films actually say" />
    <meta name="twitter:description" content="Every word of dialogue in 51,624 films, counted. Trends, leaderboards, and head-to-head film comparisons." />
    <meta name="twitter:image" content="https://moviewords.org/og.png" />
    <!-- Self-hosted fonts (see app/src/fonts.css); preload the above-the-fold ones. -->
    <link rel="preload" href="/fonts/courier-prime-700-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <!-- GoatCounter: cookieless analytics. no_onload=true so the SPA controls
         counting (hash routes aren't visible to the default auto-count). -->
    <script>
      window.goatcounter = { no_onload: true }
    </script>
    <script data-goatcounter="https://goat.moviewords.org/count" async src="//gc.zgo.at/count.js"></script>
  </head>
  <body>
    <script>
      // Apply theme before first paint (localStorage override, else OS preference).
      const saved = localStorage.getItem('theme')
      if (saved === 'dark' || (!saved && matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark')
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
